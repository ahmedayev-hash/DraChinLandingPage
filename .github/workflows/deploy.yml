name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Batalkan deploy yang masih berjalan bila ada deploy baru dipicu.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # Kunci API hanya boleh hidup di proses build. Langkah ini gagal bila
      # nilainya ternyata ikut tertulis ke dalam hasil build.
      - name: Pastikan kunci API tidak bocor ke hasil build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "TMDB_API_KEY kosong, pemeriksaan dilewati."
            exit 0
          fi

          if grep -rl -- "$TMDB_API_KEY" dist/; then
            echo "BAHAYA: kunci API ditemukan di dalam dist/"
            exit 1
          fi

          echo "BERSIH: kunci API tidak ada di dalam dist/"

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
